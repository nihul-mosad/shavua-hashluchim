<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a6b">
<title>שבוע כינוס השלוחים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a6b;--navy2:#1b3f97;--navy3:#2a5bd7;
  --gold:#f5b700;--gold2:#ffd84d;--goldsoft:#fff4c7;
  --bg:#edf3ff;--card:#ffffff;--ink:#0d1b3d;--muted:#5b6b8c;--line:#d7e1f5;
  --c1:#2f6fed;--c2:#12a594;--c3:#f08c00;--c4:#8b5cf6;
  --ok:#16a34a;--bad:#dc2626;
  --r:18px;--sh:0 6px 20px rgba(15,42,107,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans Hebrew",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 10% 0%,#fff 0,transparent 40%),radial-gradient(circle at 90% 20%,#dfe9ff 0,transparent 35%);}
h1,h2,h3,.disp{font-family:"Secular One","Noto Sans Hebrew",sans-serif;font-weight:400;margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy3)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,#2449a8 100%);color:#fff;
  padding:22px 16px 26px;border-bottom:5px solid var(--gold);box-shadow:0 8px 30px rgba(15,42,107,.25)}
.hero .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.hero h1{font-size:clamp(26px,5vw,44px);line-height:1.05}
.hero h1 span{background:linear-gradient(transparent 55%,rgba(245,183,0,.9) 55%);padding:0 6px;border-radius:4px}
.hero p{margin:6px 0 0;opacity:.85;font-size:15px}
.hero .grow{flex:1;min-width:220px}
.medal{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:30px;
  background:radial-gradient(circle at 35% 30%,#ffe98a,var(--gold) 60%,#c98d00);color:var(--navy);
  box-shadow:0 0 0 4px rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.25)}
.star{position:absolute;color:var(--gold2);opacity:.8;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.7);opacity:.35}50%{transform:scale(1.15);opacity:1}}
.hbtn{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);color:#fff;padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.24)}
.hbtn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:10px 16px;border-radius:999px;font-weight:700;color:var(--muted);background:#fff;border:2px solid var(--line)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.banner{margin:12px 0 0;background:var(--goldsoft);border:2px dashed var(--gold);border-radius:14px;padding:10px 14px;font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;border:1px solid #e3eafa}
.sec-t{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-t h2{font-size:24px;color:var(--navy)}
.sec-t .line{flex:1;height:3px;background:linear-gradient(90deg,transparent,var(--gold));border-radius:3px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:700;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.red{background:#fff;color:var(--bad);border:2px solid #f5c2c2}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* class chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{padding:10px 16px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.chip small{background:var(--goldsoft);color:#8a6400;border-radius:999px;padding:2px 8px;font-size:12px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.on small{background:var(--gold);color:var(--navy)}

/* student grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:#fff;border-radius:16px;padding:14px 10px 12px;border:2px solid #e3eafa;box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;
  background:linear-gradient(135deg,var(--navy3),var(--navy))}
.tile b{font-size:16px;text-align:center;line-height:1.2}
.tile .pts{position:absolute;top:8px;left:8px;background:var(--gold);color:var(--navy);font-weight:800;border-radius:999px;min-width:30px;padding:2px 8px;font-size:13px}
.dots{display:flex;gap:4px}
.dots i{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:1px 6px;min-width:20px;text-align:center}
.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}.k4{background:var(--c4)}
.bonus-tile{border-style:dashed;border-color:var(--gold);background:var(--goldsoft)}
.bonus-tile .av{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(13,27,61,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:24px 24px 0 0;padding:18px 16px 26px;animation:up .2s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:760px){.sheet-wrap{align-items:center}.sheet{border-radius:24px}}
.sheet h3{font-size:26px;color:var(--navy);text-align:center}
.sheet .sub{text-align:center;color:var(--muted);margin:2px 0 14px}
.cards4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--line);background:#fff;text-align:center;transition:transform .1s}
.gcard:active{transform:scale(.96)}
.gcard:hover{border-color:var(--gold)}
.gcard img{width:100%;aspect-ratio:240/170;object-fit:cover;object-position:center 20%;display:block}
.gcard .lb{display:block;padding:8px 6px 10px;font-weight:800;font-size:16px;color:#fff}
.gcard .cnt{position:absolute;top:8px;left:8px;background:#fff;color:var(--navy);font-weight:800;border-radius:999px;padding:2px 10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.gcard .plus{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--navy);font-weight:800;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-size:20px}

/* race */
.race{display:flex;flex-direction:column;gap:12px}
.lane{display:grid;grid-template-columns:54px 110px 1fr 90px;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);border:1px solid #e3eafa}
.lane.first{border:3px solid var(--gold);background:linear-gradient(90deg,#fff,var(--goldsoft))}
.rank{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:#eef2fb;color:var(--navy)}
.rank.r1{background:radial-gradient(circle at 35% 30%,#ffe98a,var(--gold));}
.rank.r2{background:radial-gradient(circle at 35% 30%,#fff,#c9d2e3)}
.rank.r3{background:radial-gradient(circle at 35% 30%,#ffe2c4,#d9894a);color:#fff}
.lane .nm{font-size:22px;color:var(--navy)}
.track{position:relative;height:38px;background:repeating-linear-gradient(90deg,#eef3ff 0 18px,#e3ebfb 18px 36px);border-radius:999px;overflow:hidden}
.fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;display:flex;transition:width .8s cubic-bezier(.2,.9,.3,1.1)}
.fill span{height:100%}
.runner{position:absolute;top:50%;transform:translate(50%,-50%);font-size:24px;transition:inset-inline-start .8s cubic-bezier(.2,.9,.3,1.1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.score{text-align:center}
.score b{display:block;font-size:26px;font-family:"Secular One";color:var(--navy);line-height:1}
.score small{color:var(--muted);font-size:12px}
@media(max-width:640px){.lane{grid-template-columns:40px 1fr 70px;grid-template-areas:"r n s" "t t t"}
 .lane .rank{grid-area:r;width:38px;height:38px;font-size:16px}.lane .nm{grid-area:n}.lane .track{grid-area:t}.lane .score{grid-area:s}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-left:5px;vertical-align:-1px}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.catcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;box-shadow:var(--sh);border-inline-start:6px solid}
.catcard img{width:76px;height:72px;object-fit:cover;border-radius:12px}
.catcard .t{font-weight:800}
.catcard .w{font-family:"Secular One";font-size:20px;color:var(--navy)}

/* stars */
.stars3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.toplist{list-style:none;padding:0;margin:10px 0 0}
.toplist li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.toplist li:last-child{border:0}
.toplist .p{margin-inline-start:auto;font-weight:800;color:var(--navy)}
.pos{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#eef2fb}

/* log */
.log{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.log td,.log th{padding:10px;border-bottom:1px solid #eef2fb;text-align:start;font-size:14px}
.log th{background:#f4f7fe;color:var(--muted);font-weight:700}
.tag{display:inline-block;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}

/* admin */
.admin{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.admin h3{color:var(--navy);font-size:20px;margin-bottom:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.clsrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.code{font-family:ui-monospace,monospace;font-weight:800;letter-spacing:2px;background:#f4f7fe;padding:3px 8px;border-radius:8px;direction:ltr;display:inline-block}
.stlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stlist span{background:#f4f7fe;border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.stlist button{width:22px;height:22px;border-radius:50%;background:#fde3e3;color:var(--bad);font-weight:800;line-height:1}
.pts4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* login */
.login{max-width:520px;margin:28px auto;display:flex;flex-direction:column;gap:14px}
.bigbtn{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:#fff;box-shadow:var(--sh);border:2px solid #e3eafa;text-align:start}
.bigbtn:hover{border-color:var(--gold)}
.bigbtn .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.bigbtn b{font-size:20px;display:block;color:var(--navy)}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:20px}

/* parent */
.pcard{background:#fff;border-radius:24px;box-shadow:var(--sh);overflow:hidden;border:1px solid #e3eafa}
.phead{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px;display:flex;align-items:center;gap:14px}
.phead h2{font-size:30px}
.phead .tot{margin-inline-start:auto;text-align:center;background:var(--gold);color:var(--navy);border-radius:18px;padding:8px 16px}
.phead .tot b{font-family:"Secular One";font-size:34px;display:block;line-height:1}
.pbody{padding:16px;display:grid;gap:10px}
.prank{display:flex;align-items:center;gap:12px;background:var(--goldsoft);border-radius:16px;padding:10px 14px;font-weight:800;color:var(--navy);font-size:18px}
.prank .bigm{font-size:34px}
.pcat{display:grid;grid-template-columns:62px 1fr 56px;gap:12px;align-items:center}
.pcat img{width:62px;height:58px;border-radius:12px;object-fit:cover}
.pcat .bar{height:14px;background:#eef3ff;border-radius:999px;overflow:hidden;margin-top:6px}
.pcat .bar span{display:block;height:100%;border-radius:999px;transition:width .8s}
.pcat .n{font-family:"Secular One";font-size:22px;text-align:center;color:var(--navy)}

/* show mode */
.show{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--navy),#132f78 60%,#0b1f52);color:#fff;overflow:auto;padding:24px}
.show h1{text-align:center;font-size:clamp(30px,5vw,60px)}
.show h1 span{background:linear-gradient(transparent 55%,rgba(245,183,0,.9) 55%);padding:0 8px}
.show .race .lane{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);box-shadow:none}
.show .race .lane.first{background:rgba(245,183,0,.18);border-color:var(--gold)}
.show .lane .nm,.show .score b{color:#fff}.show .score small{color:#c8d4f5}
.show .track{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 18px,rgba(255,255,255,.12) 18px 36px)}
.show .x{position:fixed;top:14px;left:14px;z-index:2}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;display:flex;gap:12px;align-items:center;transition:transform .25s,opacity .25s;max-width:92vw;font-weight:600;opacity:0;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
#toast button{background:var(--gold);color:var(--navy);border-radius:10px;padding:6px 12px;font-weight:800}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.empty{text-align:center;padding:30px;color:var(--muted)}
#print{display:none}
@media print{
  body{background:#fff}#app,#toast,#fx{display:none!important}#print{display:block}
  .slip{border:2px dashed #999;border-radius:12px;padding:14px;margin:0 0 12px;page-break-inside:avoid;font-size:15px}
  .slip h3{font-size:20px;margin-bottom:6px}
}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<div id="print"></div>

const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const DEF_SETTINGS={title:'שבוע כינוס השלוחים',subtitle:'ת"ת חב"ד עפולה · מבצע הכרטיסים',points:{kippah:1,lang:1,time:1,clean:1},rankBy:'total'};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(n,a)=>{const r=crypto.getRandomValues(new Uint8Array(n));let s='';r.forEach(x=>s+=a[x%a.length]);return s};
const rid=()=>rnd(20,'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789');
const newCode=()=>rnd(8,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
const zeroCats=()=>Object.fromEntries(CATS.map(c=>[c.k,0]));
const fmt=n=>Number.isInteger(n)?n.toLocaleString('he-IL'):n.toLocaleString('he-IL',{maximumFractionDigits:1});
const siteUrl=()=>location.href.split('#')[0];
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- state ---------- */
const S={classes:[],students:[],events:[],settings:structuredClone(DEF_SETTINGS)};
const UI={view:'login',tab:'give',cls:null,sheet:null,show:false,adminCls:null,user:null,loginErr:'',parentCodes:lsGet('shavua_parent_codes',[]),pdata:{}};
let API={},MODE='demo';
let renderPending=false;
function emit(){ if(isTyping()){renderPending=true;return} render(); }
function isTyping(){const a=document.activeElement;return a&&$('#app').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='q'}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending&&!isTyping()){renderPending=false;render()}},50));

/* ---------- demo store ---------- */
function initDemo(){
  const LS='shavua_demo_v1';
  let d=lsGet(LS,null);
  if(!d){
    const names=['א','ב','ג','ד','ה'];
    d={classes:names.map((n,i)=>({id:rid(),name:'כיתה '+n+'׳',order:i,code:newCode()})),students:[],events:[],settings:structuredClone(DEF_SETTINGS),pub:{}};
    d.classes.forEach(c=>{for(let i=1;i<=8;i++)d.students.push({id:rid(),classId:c.id,name:'תלמיד '+i})});
  }
  Object.assign(S,{classes:d.classes,students:d.students,events:d.events,settings:{...DEF_SETTINGS,...d.settings}});
  let pub=d.pub||{};
  const save=()=>lsSet(LS,{classes:S.classes,students:S.students,events:S.events,settings:S.settings,pub});
  const done=()=>{save();emit()};
  const upsert=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);i<0?arr.push(o):arr[i]={...arr[i],...o}};
  API={
    onAuth:cb=>cb(null),
    login:async()=>({user:{email:'הדגמה'}}),
    logout:async()=>{},
    startStaff(){emit()},stopStaff(){},
    addEvent:async e=>{S.events.push(e);done()},
    delEvent:async id=>{S.events=S.events.filter(e=>e.id!==id);done()},
    saveClass:async c=>{upsert(S.classes,c);done()},
    delClass:async id=>{S.classes=S.classes.filter(c=>c.id!==id);S.students=S.students.filter(s=>s.classId!==id);S.events=S.events.filter(e=>e.classId!==id);done()},
    addStudents:async list=>{list.forEach(s=>S.students.push(s));done()},
    delStudent:async id=>{S.students=S.students.filter(s=>s.id!==id);S.events=S.events.filter(e=>e.studentId!==id);done()},
    saveSettings:async st=>{S.settings=st;done()},
    resetEvents:async()=>{S.events=[];done()},
    writePublic:async(map,removed)=>{removed.forEach(c=>delete pub[c]);Object.assign(pub,map);save()},
    watchPublic:(code,cb)=>{cb(pub[code]||null);return()=>{}},
  };
}

  const base='https://www.gstatic.com/firebasejs/10.12.2/';

  const app=A.initializeApp(FIREBASE_CONFIG),fs=F.getFirestore(app),auth=U.getAuth(app);
  const d=(c,id)=>F.doc(fs,c,id);
  let unsubs=[];
  const fail=e=>{console.error(e);if(String(e.code||'').includes('permission')){toast('אין הרשאת צוות למשתמש הזה');API.logout()}};
  const chunks=async(ops)=>{for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(fs);ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}};
  API={
    onAuth:cb=>U.onAuthStateChanged(auth,cb),
    login:(e,p)=>U.signInWithEmailAndPassword(auth,e,p),
    logout:()=>U.signOut(auth),
    startStaff(){
      this.stopStaff();
      unsubs=[
        F.onSnapshot(F.collection(fs,'classes'),q=>{S.classes=q.docs.map(x=>({id:x.id,...x.data()}));emit()},fail),
        F.onSnapshot(F.collection(fs,'students'),q=>{S.students=q.docs.map(x=>({id:x.id,...x.data()}));emit()},fail),
        F.onSnapshot(F.collection(fs,'events'),q=>{S.events=q.docs.map(x=>({id:x.id,...x.data()}));emit()},fail),
        F.onSnapshot(d('settings','main'),x=>{const v=x.exists()?x.data():{};S.settings={...DEF_SETTINGS,...v,points:{...DEF_SETTINGS.points,...(v.points||{})}};emit()},fail),
      ];
    },
    stopStaff(){unsubs.forEach(u=>u());unsubs=[]},
    addEvent:e=>F.setDoc(d('events',e.id),e),
    delEvent:id=>F.deleteDoc(d('events',id)),
    saveClass:c=>F.setDoc(d('classes',c.id),c,{merge:true}),
    delClass:async id=>{const ops=[b=>b.delete(d('classes',id))];
      S.students.filter(s=>s.classId===id).forEach(s=>ops.push(b=>b.delete(d('students',s.id))));
      S.events.filter(e=>e.classId===id).forEach(e=>ops.push(b=>b.delete(d('events',e.id))));await chunks(ops)},
    addStudents:list=>chunks(list.map(s=>b=>b.set(d('students',s.id),s))),
    delStudent:async id=>{const ops=[b=>b.delete(d('students',id))];S.events.filter(e=>e.studentId===id).forEach(e=>ops.push(b=>b.delete(d('events',e.id))));await chunks(ops)},
    saveSettings:st=>F.setDoc(d('settings','main'),st),
    resetEvents:()=>chunks(S.events.map(e=>b=>b.delete(d('events',e.id)))),
    writePublic:(map,removed)=>chunks([...Object.entries(map).map(([c,v])=>b=>b.set(d('public',c),v)),...removed.map(c=>b=>b.delete(d('public',c)))]),
    watchPublic:(code,cb)=>F.onSnapshot(d('public',code),x=>cb(x.exists()?x.data():null),()=>cb(null)),
  };
}

/* ---------- calculations ---------- */
function calc(){
  const P=S.settings.points||DEF_SETTINGS.points;
  const cls={},st={};
  S.classes.forEach(c=>cls[c.id]={total:0,cards:0,cats:zeroCats(),n:0,bonus:0});
  S.students.forEach(s=>{st[s.id]={total:0,cats:zeroCats()};if(cls[s.classId])cls[s.classId].n++});
  S.events.forEach(e=>{
    const p=(Number(P[e.cat])||0)*(e.n||1);const c=cls[e.classId];
    if(c){c.total+=p;c.cards+=(e.n||1);c.cats[e.cat]=(c.cats[e.cat]||0)+(e.n||1);if(!e.studentId)c.bonus+=p}
    if(e.studentId&&st[e.studentId]){st[e.studentId].total+=p;st[e.studentId].cats[e.cat]+=(e.n||1)}
  });
  const avg=S.settings.rankBy==='avg';
  Object.values(cls).forEach(c=>c.score=avg?(c.n?Math.round(c.total/c.n*10)/10:0):c.total);
  const order=sortedClasses().slice().sort((a,b)=>cls[b.id].score-cls[a.id].score);
  let last=null,rank=0;order.forEach((c,i)=>{if(cls[c.id].score!==last){rank=i+1;last=cls[c.id].score}cls[c.id].rank=rank});
  return {cls,st,order,avg};
}
const sortedClasses=()=>S.classes.slice().sort((a,b)=>(a.order??0)-(b.order??0)||a.name.localeCompare(b.name,'he'));
const studentsOf=id=>S.students.filter(s=>s.classId===id).sort((a,b)=>a.name.localeCompare(b.name,'he'));

/* ---------- publish parent summaries ---------- */
let pubTimer=null;const removedCodes=new Set();
function schedulePublish(){clearTimeout(pubTimer);pubTimer=setTimeout(publishNow,1200)}
async function publishNow(){
  const {cls,order,avg}=calc();const map={};
  order.forEach(c=>{if(!c.code)return;const x=cls[c.id];
    map[c.code]={name:c.name,total:x.total,cards:x.cards,cats:x.cats,score:x.score,rank:x.rank,of:order.length,rankBy:avg?'avg':'total',
      title:S.settings.title,subtitle:S.settings.subtitle,points:S.settings.points,updatedAt:Date.now()}});
  const rem=[...removedCodes].filter(c=>!map[c]);removedCodes.clear();
  try{await API.writePublic(map,rem)}catch(e){console.error(e)}
}

async function give(target,cat){

  toast(`✓ "${CAT[cat].label}" ל${who}`,{label:'ביטול',fn:async()=>{await API.delEvent(e.id);schedulePublish();toast('הכרטיס בוטל')}});
}

/* ---------- toast & fx ---------- */
let tT;
function toast(msg,act){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`;
  if(act){const b=document.createElement('button');b.textContent=act.label;b.onclick=()=>{t.classList.remove('on');act.fn()};t.appendChild(b)}
  t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),act?5000:2500)}
const fx=$('#fx'),cx=fx.getContext('2d');let parts=[],raf=null;
function burst(){fx.width=innerWidth;fx.height=innerHeight;const cols=['#f5b700','#ffd84d','#2f6fed','#12a594','#f08c00','#8b5cf6','#fff'];
  for(let i=0;i<90;i++)parts.push({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[i%cols.length],a:1,rot:Math.random()*6});
  if(!raf)tick()}
function tick(){cx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a-=.012;p.rot+=.2;cx.save();cx.globalAlpha=Math.max(p.a,0);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);cx.restore()});
  parts=parts.filter(p=>p.a>0&&p.y<fx.height+20);raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,fx.width,fx.height),null)}

function raceHTML(){
  const {cls,order,avg}=calc();if(!order.length)return `<div class="empty">אין כיתות עדיין</div>`;
  const max=Math.max(1,...order.map(c=>cls[c.id].score));
  const lanes=order.map(c=>{const x=cls[c.id];const w=Math.max(4,x.score/max*92);const tot=x.cards||1;
    const seg=CATS.map(k=>`<span style="width:${x.cats[k.k]/tot*100}%;background:${k.color}"></span>`).join('');
    const r=x.score>0?x.rank:0;const icon=r===1?'🥇':r===2?'🥈':r===3?'🥉':r||'–';
    return `<div class="lane ${r===1&&x.score>0?'first':''}"><div class="rank r${r}">${icon}</div><div class="nm disp">${esc(c.name)}</div>
      <div class="track"><div class="fill" style="width:${w}%">${x.cards?seg:''}</div><div class="runner" style="inset-inline-start:${w}%">${r===1&&x.score>0?'🏆':'⭐'}</div></div>
      <div class="score"><b>${fmt(x.score)}</b><small>${avg?'ממוצע לתלמיד':'נקודות'}</small></div></div>`}).join('');
  return `<div class="race">${lanes}</div><div class="legend">${CATS.map(c=>`<span><i style="background:${c.color}"></i>${c.label}</span>`).join('')}</div>`;
}

}

function showView(){
  return `<div class="show"><button class="hbtn x" data-act="unshow">✕ סגירה</button>
  <h1><span>${esc(S.settings.title)}</span></h1><p style="text-align:center;opacity:.8;margin:6px 0 24px">${esc(S.settings.subtitle||'')}</p>
  <div style="max-width:1100px;margin:0 auto">${raceHTML()}</div></div>`;
}

/* ---------- parent ---------- */
function parentHero(){
  const any=Object.values(UI.pdata).find(Boolean);
  return `<header class="hero">${[[10,25],[25,70],[70,20],[88,65],[50,12]].map(([x,y],i)=>`<span class="star" style="left:${x}%;top:${y}%;animation-delay:${i*.4}s">★</span>`).join('')}
  <div class="in"><div class="medal">✓</div><div class="grow"><h1><span>${esc(any?.title||S.settings.title)}</span></h1><p>${esc(any?.subtitle||S.settings.subtitle||'')} · עמוד הורים</p></div>
  <div class="row"><button class="hbtn" data-act="goLogin">יציאה</button></div></div></header>`;
}
function parentView(){
  const codes=UI.parentCodes;
  const cards=codes.map(code=>{const p=UI.pdata[code];
    if(p===undefined)return `<div class="pcard"><div class="pbody"><div class="muted">טוען את קוד ${esc(code)}...</div></div></div>`;
    if(p===null)return `<div class="pcard"><div class="pbody"><div class="err">הקוד ${esc(code)} לא נמצא. כדאי לבדוק אותו מול הפתק מהתלמוד תורה.</div><button class="btn red sm" data-act="rmCode" data-code="${esc(code)}">הסרה</button></div></div>`;
    const maxc=Math.max(1,...CATS.map(c=>p.cats?.[c.k]||0));const r=p.rank;
    const medal=!(p.score>0)?'🏁':r===1?'🥇':r===2?'🥈':r===3?'🥉':'🏅';
    return `<div class="pcard"><div class="phead"><div><div style="opacity:.8;font-size:14px">הכיתה שלנו</div><h2>${esc(p.name)}</h2></div>
      <div class="tot"><b>${fmt(p.rankBy==='avg'?p.score:p.total)}</b><small>${p.rankBy==='avg'?'ממוצע לתלמיד':'נקודות'}</small></div></div>
      <div class="pbody"><div class="prank"><span class="bigm">${medal}</span><span>${(p.score||0)>0?`מקום ${r} מתוך ${p.of} כיתות`:'המירוץ רק התחיל — בהצלחה!'}</span></div>
      ${CATS.map(c=>{const n=p.cats?.[c.k]||0;return `<div class="pcat"><img src="${c.img}" alt=""><div><b style="color:${c.color}">${c.label}</b><div class="bar"><span style="width:${n/maxc*100}%;background:${c.color}"></span></div></div><div class="n">${fmt(n)}</div></div>`}).join('')}
      <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:12px">עודכן: ${p.updatedAt?new Date(p.updatedAt).toLocaleString('he-IL',{weekday:'short',hour:'2-digit',minute:'2-digit'}):'—'}</span>
      <button class="btn red sm" data-act="rmCode" data-code="${esc(code)}">הסרה</button></div></div></div>`}).join('');
  return `<div class="wrap" style="max-width:720px"><div class="card" style="margin-top:18px"><h3 style="color:var(--navy)">הוספת כיתה לצפייה</h3>
    <p class="muted" style="margin:4px 0 10px">הקלידו את קוד הכיתה מהפתק שקיבלתם. אם יש לכם כמה ילדים — הוסיפו קוד לכל כיתה.</p>
    <form id="cf" class="row"><input name="c" placeholder="קוד כיתה" dir="ltr" style="flex:1;text-transform:uppercase;letter-spacing:2px;font-weight:800" maxlength="12"><button class="btn gold">הוספה</button></form></div>
    <div style="display:grid;gap:16px;margin-top:16px">${cards||`<div class="empty">עדיין לא הוספתם קוד כיתה</div>`}</div>
    <p class="muted" style="text-align:center;font-size:13px;margin-top:20px">בעמוד זה מוצג ניקוד כיתתי כולל בלבד.</p></div>`;
}
const watchers={};
function watchCodes(){
  UI.parentCodes.forEach(code=>{if(watchers[code])return;watchers[code]=API.watchPublic(code,d=>{UI.pdata[code]=d;if(UI.view==='parent')emit()})});
  Object.keys(watchers).forEach(c=>{if(!UI.parentCodes.includes(c)){try{watchers[c]()}catch(e){}delete watchers[c];delete UI.pdata[c]}});
}
function addCode(c){c=String(c||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!c)return;if(!UI.parentCodes.includes(c))UI.parentCodes.push(c);lsSet('shavua_parent_codes',UI.parentCodes);watchCodes()}

/* ---------- print slips ---------- */
function printSlips(){
  const url=siteUrl();
  $('#print').innerHTML=sortedClasses().map(c=>`<div class="slip"><h3>${esc(S.settings.title)} — ${esc(c.name)}</h3>
   <div>הורים יקרים, אפשר לעקוב אחרי ניקוד הכיתה במבצע הכרטיסים באתר:</div>
   <div style="direction:ltr;text-align:left;font-weight:700;margin:6px 0">${esc(url)}</div>
   <div>בוחרים "כניסת הורים" ומקלידים את קוד הכיתה: <b style="font-size:20px;letter-spacing:3px">${esc(c.code||'')}</b></div></div>`).join('');
  setTimeout(()=>print(),100);
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'goParent':UI.view='parent';watchCodes();render();break;
    case 'goLogin':UI.view='login';history.replaceState(null,'',siteUrl());render();break;
    case 'demoLogin':UI.user={email:'הדגמה'};UI.view='staff';API.startStaff();render();break;
    case 'logout':await API.logout();UI.user=null;API.stopStaff();UI.view='login';render();break;
    case 'tab':UI.tab=el.dataset.k;render();break;
    case 'cls':UI.cls=id;render();break;
    case 'pick':UI.sheet={studentId:id,classId:S.students.find(s=>s.id===id)?.classId};render();break;
    case 'pickClass':UI.sheet={classId:UI.cls};render();break;
    case 'closeSheet':if(ev.target.closest('.sheet')&&!ev.target.closest('button'))return;UI.sheet=null;render();break;
    case 'give':await give(UI.sheet,el.dataset.cat);break;
    case 'show':UI.show=true;render();try{document.documentElement.requestFullscreen?.()}catch(e){}break;
    case 'unshow':UI.show=false;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}render();break;
    case 'delEv':if(confirm('למחוק את הכרטיס?')){await API.delEvent(id);schedulePublish()}break;
    case 'saveSettings':{const p={};CATS.forEach(c=>p[c.k]=Math.max(0,Number($('#s_p_'+c.k).value)||0));
      await API.saveSettings({title:$('#s_title').value.trim()||DEF_SETTINGS.title,subtitle:$('#s_sub').value.trim(),points:p,rankBy:$('#s_rank').value});
      schedulePublish();toast('ההגדרות נשמרו');break}
    case 'addCls':{const n=$('#newCls').value.trim();if(!n)return;await API.saveClass({id:rid(),name:n,order:S.classes.length,code:newCode()});schedulePublish();toast('הכיתה נוספה');break}
    case 'renameCls':{const v=document.querySelector(`[data-cname="${id}"]`).value.trim();if(!v)return;await API.saveClass({id,name:v});schedulePublish();toast('נשמר');break}
    case 'delCls':{const c=S.classes.find(x=>x.id===id);if(!confirm(`למחוק את ${c.name} כולל התלמידים והכרטיסים שלה?`))return;if(c.code)removedCodes.add(c.code);await API.delClass(id);schedulePublish();break}
    case 'newCode':{const c=S.classes.find(x=>x.id===id);if(!confirm('ליצור קוד חדש? הקוד הישן יפסיק לעבוד אצל ההורים.'))return;if(c.code)removedCodes.add(c.code);await API.saveClass({id,code:newCode()});schedulePublish();break}
    case 'copyLink':{const c=S.classes.find(x=>x.id===id);const t=`${siteUrl()}#p=${c.code}`;try{await navigator.clipboard.writeText(t);toast('הקישור הועתק')}catch(e){prompt('העתיקו את הקישור:',t)}break}
    case 'addStuds':{const names=$('#newStuds').value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);if(!names.length)return;
      await API.addStudents(names.map(n=>({id:rid(),classId:UI.adminCls,name:n})));$('#newStuds').value='';toast(`נוספו ${names.length} תלמידים`);break}
    case 'delStud':{const s=S.students.find(x=>x.id===id);if(!confirm(`למחוק את ${s.name}? גם הכרטיסים שלו יימחקו.`))return;await API.delStudent(id);schedulePublish();break}
    case 'printSlips':printSlips();break;
    case 'reset':{const v=prompt('לאיפוס כל הניקוד הקלידו: איפוס');if(v!=='איפוס')return;await API.resetEvents();schedulePublish();toast('הניקוד אופס');break}
    case 'rmCode':UI.parentCodes=UI.parentCodes.filter(c=>c!==el.dataset.code);lsSet('shavua_parent_codes',UI.parentCodes);watchCodes();render();break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='aCls'){UI.adminCls=e.target.value;e.target.blur();render()}});
document.addEventListener('input',e=>{if(e.target.id==='q')filterTiles()});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='cf'){addCode(e.target.c.value);e.target.c.value='';render()}
  if(e.target.id==='lf'){UI.loginErr='';try{await API.login(e.target.e.value.trim(),e.target.p.value)}catch(err){UI.loginErr='דוא"ל או סיסמה שגויים';render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.sheet){UI.sheet=null;render()}else if(UI.show){UI.show=false;render()}}});

/* ---------- boot ---------- */
(async function boot(){
  if(FIREBASE_CONFIG){MODE='fb';try{await initFirebase()}catch(e){console.error(e);MODE='demo';initDemo()}}else{initDemo();await publishNow()}
  const m=location.hash.match(/p=([A-Za-z0-9]+)/);
  if(m){addCode(m[1]);UI.view='parent';history.replaceState(null,'',siteUrl())}
  if(MODE==='fb')API.onAuth(u=>{UI.user=u;if(u){if(UI.view!=='parent'){UI.view='staff'}API.startStaff()}else{API.stopStaff();if(UI.view==='staff')UI.view='login'}render()});
  watchCodes();render();
})();
</script>
</body>
</html>
